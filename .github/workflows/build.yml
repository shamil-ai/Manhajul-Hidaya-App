name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download project from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install Cordova
      - name: Install Cordova
        run: |
          npm install -g cordova

      # 5. Prepare Cordova project
      - name: Prepare Cordova Project
        run: |
          npm install

          if [ ! -d "www" ]; then
            mkdir -p www
          fi

          echo '<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0; url=https://manhajulhidaya.vercel.app/">
            <title>Manhajul Hidaya</title>
          </head>
          <body>
            <p>Loading Manhajul Hidaya...</p>
          </body>
          </html>' > www/index.html

      # 6. Add Android platform
      - name: Add Android Platform
        run: |
          cordova platform add android

      # 7. Generate signing keystore
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PWD/release.keystore" \
            -alias grafixora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Grafixora, OU=ManhajulHidaya, O=Grafixora, L=Kochi, S=Kerala, C=IN" \
            -storepass grafixora123 \
            -keypass grafixora123

      # 8. Build RELEASE APK
      - name: Build Release APK
        run: |
          cordova build android --release -- \
            --packageType=apk \
            --keystore="$PWD/release.keystore" \
            --storePassword=grafixora123 \
            --alias=grafixora \
            --password=grafixora123

      # 9. Find generated APK
      - name: Find APK
        run: |
          echo "======================================"
          echo "Searching for APK files..."
          echo "======================================"

          find platforms/android -type f -name "*.apk" -print

      # 10. Prepare APK for GitHub Artifact
      - name: Prepare APK for Upload
        run: |
          mkdir -p apk-output

          APK=$(find platforms/android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "======================================"
            echo "ERROR: APK not found!"
            echo "======================================"
            echo "All generated files:"
            find platforms/android -type f | sort
            exit 1
          fi

          echo "======================================"
          echo "APK FOUND:"
          echo "$APK"
          echo "======================================"

          cp "$APK" "apk-output/ManhajulHidaya-Official-App.apk"

          echo "======================================"
          echo "APK READY FOR UPLOAD"
          echo "======================================"

          ls -lh apk-output/

      # 11. Upload APK to GitHub Actions
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhajulHidaya-Official-App
          path: apk-output/ManhajulHidaya-Official-App.apk
          if-no-files-found: error
