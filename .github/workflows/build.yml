name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Project (Fix for www folder)
      run: |
        npm install
        mkdir www
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://manhajulhidaya.vercel.app/" /></head><body></body></html>' > www/index.html

    - name: Add Android Platform
      run: cordova platform add android

    - name: Build APK
      run: cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ManhajulHidaya-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
