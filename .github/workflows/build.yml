name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Project
      run: |
        npm install
        mkdir www
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://manhajulhidaya.vercel.app/" /></head><body></body></html>' > www/index.html

    - name: Add Android Platform
      run: cordova platform add android

    - name: Generate Keystore (For App Signing)
      run: |
        keytool -genkey -v -keystore $PWD/release.keystore -alias grafixora -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Grafixora, OU=ManhajulHidaya, O=Grafixora, L=Kochi, S=Kerala, C=IN" -storepass grafixora123 -keypass grafixora123

    - name: Build Release APK
      run: cordova build android --release -- --keystore=$PWD/release.keystore --storePassword=grafixora123 --alias=grafixora --password=grafixora123

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: ManhajulHidaya-Official-App
        path: platforms/android/app/build/outputs/apk/release/app-release*.apk
